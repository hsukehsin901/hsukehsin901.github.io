<section class="trip-map" aria-label="足跡地圖">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <div id="trip-map"></div>
  <p class="trip-map-note" id="trip-map-note"></p>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (function () {
      var trips = {{ site.data.trips | jsonify }};
      var map = L.map('trip-map', { scrollWheelZoom: false, worldCopyJump: true, minZoom: 2 }).setView([30, 70], 2);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
        subdomains: 'abcd', maxZoom: 12
      }).addTo(map);
      var pin = L.divIcon({ className: 'trip-pin', html: '<span></span>', iconSize: [16, 16], iconAnchor: [8, 8], popupAnchor: [0, -8] });
      var spots = {}, countries = {}, abroad = 0;
      trips.forEach(function (t) {
        if (!t.domestic) abroad++;
        var link = t.post ? '/travel/' + t.post + '/' : (t.tag ? '/travel/?tag=' + encodeURIComponent(t.tag) : '');
        t.places.forEach(function (p) {
          if (p.c !== '台灣') countries[p.c] = 1;
          var key = p.n;
          if (!spots[key]) spots[key] = { p: p, visits: [] };
          spots[key].visits.push({ t: t, link: link });
        });
      });
      Object.keys(spots).forEach(function (k) {
        var s = spots[k], v = s.visits;
        var html = '<strong>' + s.p.n + '</strong><span class="pop-meta">（' + s.p.c + '）' + (v.length > 1 ? '・去過 ' + v.length + ' 次' : '') + '</span><ul class="pop-list">' +
          v.map(function (x) {
            var t = x.t, meta = [t.days ? t.days + ' 天' : '', t.group ? '跟團' : ''].filter(Boolean).join('・');
            var label = t.year + '　' + t.name + (meta ? '<span class="pop-meta">（' + meta + '）</span>' : '');
            return '<li>' + (x.link ? '<a href="' + x.link + '">' + label + ' →</a>' : label) + '</li>';
          }).join('') + '</ul>';
        L.marker(s.p.ll, { icon: v.length > 1 ? bigPin(v.length) : pin, title: s.p.n }).addTo(map).bindPopup(html, { maxHeight: 260 });
      });
      function bigPin(n) {
        var z = Math.min(26, 14 + n * 1.5);
        return L.divIcon({ className: 'trip-pin many', html: '<span style="width:' + z + 'px;height:' + z + 'px">' + n + '</span>', iconSize: [z, z], iconAnchor: [z / 2, z / 2], popupAnchor: [0, -z / 2] });
      }
      document.getElementById('trip-map-note').textContent =
        abroad + ' 趟出國旅行，走過 ' + Object.keys(countries).length + ' 個國家和地區、' + Object.keys(spots).length + ' 個地方。數字大的圖釘代表去過好幾次，點點看。';
    })();
  </script>
</section>
