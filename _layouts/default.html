<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }}｜{% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 120 }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="主選單">
        {% for c in site.category_names %}<a href="{{ '/' | append: c[0] | append: '/' | relative_url }}">{{ c[1] }}</a>{% endfor %}
        <a href="{{ '/about/' | relative_url }}">關於我</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">© {{ 'now' | date: '%Y' }} {{ site.title }}</div>
  </footer>
</body>
</html>
