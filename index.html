---
layout: default
title: 首頁
---
<section class="intro">
  <h1>{{ site.title }}</h1>
  <p class="lead">{{ site.description }}</p>
</section>

<ul class="cat-grid">
  {% for c in site.category_names %}
  <li><a href="{{ '/' | append: c[0] | append: '/' | relative_url }}">
    <strong>{{ c[1] }}</strong>
    <span>{{ site.category_descriptions[c[0]] }}</span>
  </a></li>
  {% endfor %}
</ul>

<h2>最新文章</h2>
{% include post-list.html posts=site.posts %}
